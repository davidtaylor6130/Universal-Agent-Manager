<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Keep in step with uam::html_view::kContentSecurityPolicy; UAM also sends it as this file's response header. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
</head>
<body>
<script>
// Host for one agent HTML view inside a sandboxed frame without allow-same-origin.
// It accepts a single document from its embedding UAM window and never talks back.
(function () {
  var written = false
  addEventListener('message', function (event) {
    var data = event.data
    if (written || event.source !== parent || !data || data.type !== 'uam-html-view' || typeof data.html !== 'string') return
    written = true
    document.open()
    document.write(data.html)
    document.close()
  })
})()
</script>
</body>
</html>
