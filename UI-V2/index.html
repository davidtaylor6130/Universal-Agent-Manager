<!doctype html>
<html lang="en" data-theme="focus">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app_icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app_icon-180.png" />
    <link rel="manifest" href="/companion.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UAM — Universal Agent Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <section id="uam-startup-recovery" role="alert" aria-label="Interface recovery" style="background:#000;color:#fff;padding:24px;font:14px system-ui;position:fixed;inset:0;z-index:2147483647">
      <h1 style="font-size:16px;margin:0 0 12px">The interface could not load.</h1>
      <p>Reload the interface to try again.</p>
      <p>Active sessions keep running. Unsaved drafts may be lost when reloading.</p>
      <button class="uam-recovery-button" id="uam-reload-interface">Reload interface</button>
      <p>Native recovery shortcut: Ctrl+Shift+R</p>
    </section>
    <link rel="stylesheet" href="/ui-recovery.css" />
    <script src="/ui-recovery.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
