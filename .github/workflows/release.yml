name: Release Build

# Builds unsigned (ad-hoc signed) macOS .app and Windows .exe packages and
# attaches them to the GitHub Release for the pushed tag.
#
# Trigger: push a tag like `v2.0.3`. Use workflow_dispatch to dry-run a build
# without publishing a release (artifacts are still uploaded to the run).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-evidence:
    name: Dependency evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate locked frontend SBOM
        run: npm --prefix UI-V2 sbom --package-lock-only --sbom-format cyclonedx > UAM-frontend.cdx.json
      - name: Validate frontend SBOM
        run: node -e "const value = JSON.parse(require('fs').readFileSync('UAM-frontend.cdx.json', 'utf8')); if (value.bomFormat !== 'CycloneDX' || !Array.isArray(value.components) || value.components.length === 0) throw new Error('Invalid or empty frontend SBOM.');"
      - uses: actions/upload-artifact@v4
        with:
          name: UAM-frontend-SBOM
          path: UAM-frontend.cdx.json
          if-no-files-found: error

  remote-runner:
    name: Remote runner ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
            artifact: UAM-runner-linux-x86_64
            binary: Builds/runner/uam-runner
            checksum: Builds/runner/uam-runner.sha256
            version: Builds/runner/uam-runner.version
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            artifact: UAM-runner-linux-arm64
            binary: Builds/runner/uam-runner
            checksum: Builds/runner/uam-runner.sha256
            version: Builds/runner/uam-runner.version
          - os: windows-latest
            platform: windows
            arch: x86_64
            artifact: UAM-runner-windows-x86_64
            binary: Builds/runner/Release/uam-runner.exe
            checksum: Builds/runner/Release/uam-runner.sha256
            version: Builds/runner/Release/uam-runner.version
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B Builds/runner -DUAM_RUNNER_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build Builds/runner --config Release --target uam_runner --parallel 4
      - name: Smoke runner version (Linux)
        if: runner.os == 'Linux'
        run: test "$(Builds/runner/uam-runner --version)" = "$(tr -d '\r\n' < Builds/runner/uam-runner.version)"
      - name: Smoke runner version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if ((& Builds/runner/Release/uam-runner.exe --version).Trim() -ne (Get-Content -Raw Builds/runner/Release/uam-runner.version).Trim()) { throw 'Runner version mismatch.' }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.binary }}
            ${{ matrix.checksum }}
            ${{ matrix.version }}
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    needs: remote-runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS ARM
            arch: arm64
            archive: UAM-macOS-ARM.zip
            artifact: UAM-macOS-ARM
          - os: macos-26-intel
            name: macOS Intel
            arch: x86_64
            archive: UAM-macOS-Intel.zip
            artifact: UAM-macOS-Intel
          - os: windows-latest
            name: Windows
            arch: x64
            archive: UAM-Windows.zip
            artifact: UAM-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: UAM-runner-linux-x86_64
          path: Builds/remote-artifacts/linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: UAM-runner-linux-arm64
          path: Builds/remote-artifacts/linux-arm64
      - uses: actions/download-artifact@v4
        with:
          name: UAM-runner-windows-x86_64
          path: Builds/remote-artifacts/windows-x86_64

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UI-V2/package-lock.json

      # CEF (hundreds of MB) and nlohmann/json are fetched into Builds/_deps by
      # CMake FetchContent. Cache that dir keyed on CMakeLists.txt (the CEF pin).
      - name: Cache fetched dependencies (CEF, nlohmann/json)
        uses: actions/cache@v4
        with:
          path: Builds/_deps
          key: ${{ runner.os }}-${{ matrix.arch }}-uam-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-uam-deps-

      - name: Install frontend dependencies
        run: npm --prefix UI-V2 ci

      - name: Test frontend
        run: npm --prefix UI-V2 run test

      - name: Validate release tag matches product version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const version = require('./UI-V2/package.json').version; const tag = 'v' + version; if (process.env.GITHUB_REF_NAME !== tag) throw new Error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match ' + tag + '.');"

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B Builds -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DUAM_BUILD_TESTS=ON -DUAM_REMOTE_RUNNER_ARTIFACT_DIR="$GITHUB_WORKSPACE/Builds/remote-artifacts"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B Builds -A x64 -DUAM_BUILD_TESTS=ON -DUAM_REMOTE_RUNNER_ARTIFACT_DIR="$env:GITHUB_WORKSPACE/Builds/remote-artifacts"

      - name: Build
        run: cmake --build Builds --config Release --parallel 4

      - name: Test native Release build
        run: ctest --test-dir Builds -C Release --output-on-failure

      # macOS output: Builds/universal_agent_manager.app (ad-hoc signed via
      # `codesign --sign -`, no certificate required). ditto preserves the bundle.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent Builds/universal_agent_manager.app ${{ matrix.archive }}

      - name: Smoke test packaged macOS app
        if: runner.os == 'macOS'
        run: bash scripts/smoke_packaged_macos.sh ${{ matrix.archive }} Builds/UI-V2/dist

      # Windows output: Builds/Release/ holds the .exe plus the CEF DLLs,
      # resources, and the bundled UI-V2/dist — zip the whole payload.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item Builds/Release/uam_core_tests* -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path Builds/Release/* -DestinationPath ${{ matrix.archive }}

      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke_packaged_windows.ps1 ${{ matrix.archive }} Builds/UI-V2/dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, security-evidence, remote-runner]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach packages to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.cdx.json
          fail_on_unmatched_files: true
          generate_release_notes: true
