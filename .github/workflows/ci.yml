name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UI-V2/package-lock.json

      - uses: actions/cache@v4
        with:
          path: Builds/tests/_deps
          key: ${{ runner.os }}-uam-test-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-uam-test-deps-
            ${{ runner.os }}-uam-deps-

      - run: npm --prefix UI-V2 ci
      - run: npm --prefix UI-V2 run test
      - run: npm --prefix UI-V2 run build
      - name: Configure native Release tests (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B Builds/tests -DCMAKE_BUILD_TYPE=Release -DUAM_BUILD_TESTS=ON
      - name: Configure native Release tests (Windows x64)
        if: runner.os == 'Windows'
        run: cmake -S . -B Builds/tests -A x64 -DUAM_BUILD_TESTS=ON
      - run: cmake --build Builds/tests --config Release --parallel 4
      - run: ctest --test-dir Builds/tests -C Release --output-on-failure
      - name: Package Windows review build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item Builds/tests/Release/uam_core_tests* -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path Builds/tests/Release/* -DestinationPath UAM-Windows-PR.zip

      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'uam-package'
          Expand-Archive UAM-Windows-PR.zip -DestinationPath $packageRoot
          $env:UAM_DATA_DIR = Join-Path $env:RUNNER_TEMP 'uam-smoke'
          $process = Start-Process (Join-Path $packageRoot 'universal_agent_manager.exe') -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Packaged Windows app exited during startup with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force

      - name: Upload Windows Release review artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: UAM-Windows-Release-PR
          path: UAM-Windows-PR.zip
          if-no-files-found: error
