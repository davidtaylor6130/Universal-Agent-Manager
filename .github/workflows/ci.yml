name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UI-V2/package-lock.json

      - uses: actions/cache@v4
        with:
          path: Builds/_deps
          key: ${{ runner.os }}-uam-test-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-uam-test-deps-
            ${{ runner.os }}-uam-deps-

      - run: npm --prefix UI-V2 ci
      - run: npm --prefix UI-V2 run test
      - run: npm --prefix UI-V2 run build
      - run: cmake -S . -B Builds/tests -DUAM_BUILD_TESTS=ON
      - run: cmake --build Builds/tests --config Debug
      - run: ctest --test-dir Builds/tests -C Debug --output-on-failure
      - name: Smoke test Windows app launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:UAM_DATA_DIR = Join-Path $env:RUNNER_TEMP 'uam-smoke'
          $process = Start-Process Builds/tests/Debug/universal_agent_manager.exe -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Windows app exited during startup with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force
