name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-evidence:
    name: Dependency evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate locked frontend SBOM
        run: npm --prefix UI-V2 sbom --package-lock-only --sbom-format cyclonedx > UAM-frontend.cdx.json
      - name: Validate frontend SBOM
        run: node -e "const value = JSON.parse(require('fs').readFileSync('UAM-frontend.cdx.json', 'utf8')); if (value.bomFormat !== 'CycloneDX' || !Array.isArray(value.components) || value.components.length === 0) throw new Error('Invalid or empty frontend SBOM.');"
      - uses: actions/upload-artifact@v4
        with:
          name: UAM-frontend-SBOM-PR
          path: UAM-frontend.cdx.json
          if-no-files-found: error

  remote-runner:
    name: Remote runner ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
            artifact: UAM-runner-linux-x86_64
            binary: Builds/runner/uam-runner
            checksum: Builds/runner/uam-runner.sha256
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            artifact: UAM-runner-linux-arm64
            binary: Builds/runner/uam-runner
            checksum: Builds/runner/uam-runner.sha256
          - os: windows-latest
            platform: windows
            arch: x86_64
            artifact: UAM-runner-windows-x86_64
            binary: Builds/runner/Release/uam-runner.exe
            checksum: Builds/runner/Release/uam-runner.sha256
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B Builds/runner -DUAM_RUNNER_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build Builds/runner --config Release --target uam_runner --parallel 4
      - name: Smoke runner version (Linux)
        if: runner.os == 'Linux'
        run: test "$(Builds/runner/uam-runner --version)" = "4.8.0-alpha-2"
      - name: Smoke runner version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if ((& Builds/runner/Release/uam-runner.exe --version) -ne '4.8.0-alpha-2') { throw 'Runner version mismatch.' }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.binary }}
            ${{ matrix.checksum }}
          if-no-files-found: error

  test:
    name: Test ${{ matrix.name }}
    needs: remote-runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS ARM
            arch: arm64
            archive: UAM-macOS-ARM-PR.zip
            artifact: UAM-macOS-ARM-Release-PR
          - os: macos-26-intel
            name: macOS Intel
            arch: x86_64
            archive: UAM-macOS-Intel-PR.zip
            artifact: UAM-macOS-Intel-Release-PR
          - os: windows-latest
            name: Windows
            arch: x64
            archive: UAM-Windows-PR.zip
            artifact: UAM-Windows-Release-PR
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: UAM-runner-linux-x86_64
          path: Builds/remote-artifacts/linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: UAM-runner-linux-arm64
          path: Builds/remote-artifacts/linux-arm64
      - uses: actions/download-artifact@v4
        with:
          name: UAM-runner-windows-x86_64
          path: Builds/remote-artifacts/windows-x86_64

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UI-V2/package-lock.json

      - uses: actions/cache@v4
        with:
          path: Builds/tests/_deps
          key: ${{ runner.os }}-${{ matrix.arch }}-uam-test-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-uam-test-deps-
            ${{ runner.os }}-${{ matrix.arch }}-uam-deps-

      - run: npm --prefix UI-V2 ci
      - run: npm --prefix UI-V2 run test
      - run: npm --prefix UI-V2 run build
      - name: Configure native Release tests (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B Builds/tests -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DUAM_BUILD_TESTS=ON -DUAM_REMOTE_RUNNER_ARTIFACT_DIR="$GITHUB_WORKSPACE/Builds/remote-artifacts"
      - name: Configure native Release tests (Windows x64)
        if: runner.os == 'Windows'
        run: cmake -S . -B Builds/tests -A x64 -DUAM_BUILD_TESTS=ON -DUAM_REMOTE_RUNNER_ARTIFACT_DIR="$env:GITHUB_WORKSPACE/Builds/remote-artifacts"
      - run: cmake --build Builds/tests --config Release --parallel 4
      - run: ctest --test-dir Builds/tests -C Release --output-on-failure
      - name: Package macOS review build
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent Builds/tests/universal_agent_manager.app ${{ matrix.archive }}

      - name: Smoke test packaged macOS app
        if: runner.os == 'macOS'
        run: bash scripts/smoke_packaged_macos.sh ${{ matrix.archive }} Builds/tests/UI-V2/dist

      - name: Package Windows review build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item Builds/tests/Release/uam_core_tests* -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path Builds/tests/Release/* -DestinationPath ${{ matrix.archive }}

      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke_packaged_windows.ps1 ${{ matrix.archive }} Builds/tests/UI-V2/dist

      - name: Upload Windows Release review artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload macOS Release review artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
