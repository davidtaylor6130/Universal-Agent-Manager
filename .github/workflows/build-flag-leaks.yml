name: Build flag leak gate

# Each matrix row builds with one flag OFF (or all providers but one) and fails when the output still
# mentions what the flags excluded. See docs/build-flags.md and scripts/build_flag_leak_allowlist.json.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 2'
  pull_request:
    # 'labeled' lets adding the build-flags label start the native rows.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/build-flag-leaks.yml'
      - 'scripts/check_build_flag_leaks.py'
      - 'scripts/build_flag_leak_allowlist.json'
      - 'scripts/build_flag_native_residue.json'
      - 'tests/build_flag_leak_gate_test.py'
      - 'CMakeLists.txt'
      - 'cmake/**'
      # Native sources and everything the bundle packages (resources, skills, UI) can add an excluded name.
      - 'src/**'
      - 'assets/**'
      - 'markdown-store/**'
      - 'UI-V2/**'

permissions:
  contents: read

jobs:
  gate-self-test:
    name: Gate self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/build_flag_leak_gate_test.py
      - run: python3 tests/ui_build_incremental_test.py

  ui:
    name: UI ${{ matrix.name }}
    needs: gate-self-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'no Gemini', off: 'GEMINI' }
          - { name: 'no Codex', off: 'CODEX' }
          - { name: 'no Claude', off: 'CLAUDE' }
          - { name: 'no OpenCode', off: 'OPENCODE' }
          - { name: 'no Copilot', off: 'COPILOT' }
          - { name: 'no Antigravity', off: 'ANTIGRAVITY' }
          - { name: 'no SSH', off: 'SSH' }
          - { name: 'no computer use', off: 'COMPUTER_USE' }
          - { name: 'no phone access', off: 'MOBILE_COMPANION' }
          - { name: 'only Gemini', off: 'CODEX CLAUDE OPENCODE COPILOT ANTIGRAVITY' }
          - { name: 'only Codex', off: 'GEMINI CLAUDE OPENCODE COPILOT ANTIGRAVITY' }
          - { name: 'only Claude', off: 'GEMINI CODEX OPENCODE COPILOT ANTIGRAVITY' }
          - { name: 'only OpenCode', off: 'GEMINI CODEX CLAUDE COPILOT ANTIGRAVITY' }
          - { name: 'only Copilot', off: 'GEMINI CODEX CLAUDE OPENCODE ANTIGRAVITY' }
          - { name: 'only Antigravity', off: 'GEMINI CODEX CLAUDE OPENCODE COPILOT' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UI-V2/package-lock.json
      - run: npm --prefix UI-V2 ci
      - name: Build the bundle with the flags OFF
        shell: bash
        run: |
          for flag in ${{ matrix.off }}; do export "UAM_FEATURE_${flag}=0"; done
          VITE_UAM_OUT_DIR="$RUNNER_TEMP/dist" npm --prefix UI-V2 run build
      - name: Check the bundle for excluded names
        run: python3 scripts/check_build_flag_leaks.py --dist "$RUNNER_TEMP/dist" --disabled ${{ matrix.off }}

  # A skipped matrix job shows only its unexpanded name, so say plainly why the native rows did not run.
  native-skipped:
    name: Native flag builds not requested (add the build-flags label to run 19 full builds)
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'build-flags')
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "### Native build-flag rows skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Each native row is a full application build with one feature or provider set turned off. Pull requests run them only with the \`build-flags\` label; pushes, schedules and manual runs always do. The UI rows above already checked the frontend bundle for every flag." >> "$GITHUB_STEP_SUMMARY"

  native:
    name: Native ${{ matrix.name }}
    needs: ui
    # Full application builds are expensive: pull requests run them only with the build-flags label; schedules and
    # manual runs always do. Rows whose native residue is not yet reviewed in build_flag_native_residue.json report
    # but do not fail the workflow; their failure uploads the candidate strings for review.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-flags')
    runs-on: macos-latest
    continue-on-error: ${{ !matrix.measured }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'no Gemini', cmake: '-DUAM_ENABLE_RUNTIME_GEMINI_CLI=OFF' }
          - { name: 'no Codex', cmake: '-DUAM_ENABLE_RUNTIME_CODEX_CLI=OFF' }
          - { name: 'no Claude', cmake: '-DUAM_ENABLE_RUNTIME_CLAUDE_CLI=OFF', measured: true }
          - { name: 'no OpenCode', cmake: '-DUAM_ENABLE_RUNTIME_OPENCODE_CLI=OFF' }
          - { name: 'no Copilot', cmake: '-DUAM_ENABLE_RUNTIME_COPILOT_CLI=OFF' }
          - { name: 'no Antigravity', cmake: '-DUAM_ENABLE_RUNTIME_ANTIGRAVITY_CLI=OFF' }
          - { name: 'no SSH', cmake: '-DUAM_ENABLE_SSH=OFF' }
          - { name: 'no computer use', cmake: '-DUAM_ENABLE_COMPUTER_USE=OFF' }
          - { name: 'no phone access', cmake: '-DUAM_ENABLE_MOBILE_COMPANION=OFF' }
          # Packaging-only profiles: nothing is excluded, but the helper folders and expected executable are checked.
          - { name: 'all on, no packaged remote helpers', cmake: '', measured: true }
          - { name: 'runner only, all providers', cmake: '-DUAM_RUNNER_ONLY=ON', target: uam_runner, measured: true }
          - { name: 'runner only, no OpenCode or Antigravity', cmake: '-DUAM_RUNNER_ONLY=ON -DUAM_ENABLE_RUNTIME_OPENCODE_CLI=OFF -DUAM_ENABLE_RUNTIME_ANTIGRAVITY_CLI=OFF', target: uam_runner }
          - { name: 'only Gemini', cmake: '-DUAM_ENABLE_RUNTIME_CODEX_CLI=OFF -DUAM_ENABLE_RUNTIME_CLAUDE_CLI=OFF -DUAM_ENABLE_RUNTIME_OPENCODE_CLI=OFF -DUAM_ENABLE_RUNTIME_COPILOT_CLI=OFF -DUAM_ENABLE_RUNTIME_ANTIGRAVITY_CLI=OFF' }
          - { name: 'only Codex', cmake: '-DUAM_ENABLE_RUNTIME_GEMINI_CLI=OFF -DUAM_ENABLE_RUNTIME_CLAUDE_CLI=OFF -DUAM_ENABLE_RUNTIME_OPENCODE_CLI=OFF -DUAM_ENABLE_RUNTIME_COPILOT_CLI=OFF -DUAM_ENABLE_RUNTIME_ANTIGRAVITY_CLI=OFF' }
          - { name: 'only Claude', cmake: '-DUAM_ENABLE_RUNTIME_GEMINI_CLI=OFF -DUAM_ENABLE_RUNTIME_CODEX_CLI=OFF -DUAM_ENABLE_RUNTIME_OPENCODE_CLI=OFF -DUAM_ENABLE_RUNTIME_COPILOT_CLI=OFF -DUAM_ENABLE_RUNTIME_ANTIGRAVITY_CLI=OFF' }
          - { name: 'only OpenCode', cmake: '-DUAM_ENABLE_RUNTIME_GEMINI_CLI=OFF -DUAM_ENABLE_RUNTIME_CODEX_CLI=OFF -DUAM_ENABLE_RUNTIME_CLAUDE_CLI=OFF -DUAM_ENABLE_RUNTIME_COPILOT_CLI=OFF -DUAM_ENABLE_RUNTIME_ANTIGRAVITY_CLI=OFF' }
          - { name: 'only Copilot', cmake: '-DUAM_ENABLE_RUNTIME_GEMINI_CLI=OFF -DUAM_ENABLE_RUNTIME_CODEX_CLI=OFF -DUAM_ENABLE_RUNTIME_CLAUDE_CLI=OFF -DUAM_ENABLE_RUNTIME_OPENCODE_CLI=OFF -DUAM_ENABLE_RUNTIME_ANTIGRAVITY_CLI=OFF' }
          - { name: 'only Antigravity', cmake: '-DUAM_ENABLE_RUNTIME_GEMINI_CLI=OFF -DUAM_ENABLE_RUNTIME_CODEX_CLI=OFF -DUAM_ENABLE_RUNTIME_CLAUDE_CLI=OFF -DUAM_ENABLE_RUNTIME_OPENCODE_CLI=OFF -DUAM_ENABLE_RUNTIME_COPILOT_CLI=OFF' }
          # Mixed profile: several providers on with Claude, Codex and OpenCode off, which shared code reaches differently from one-provider builds.
          - { name: 'Gemini, Copilot and Antigravity only, local features', cmake: '-DUAM_ENABLE_RUNTIME_CODEX_CLI=OFF -DUAM_ENABLE_RUNTIME_CLAUDE_CLI=OFF -DUAM_ENABLE_RUNTIME_OPENCODE_CLI=OFF -DUAM_ENABLE_COMPUTER_USE=OFF -DUAM_ENABLE_SSH=OFF -DUAM_ENABLE_MOBILE_COMPANION=OFF' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UI-V2/package-lock.json
      - uses: actions/cache@v4
        with:
          path: Builds/flags/_deps
          key: macOS-uam-flag-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: macOS-uam-flag-deps-
      - run: npm --prefix UI-V2 ci
      - run: cmake -S . -B Builds/flags -DCMAKE_BUILD_TYPE=Release -DUAM_PACKAGE_REMOTE_RUNNERS=OFF ${{ matrix.cmake }}
      - run: cmake --build Builds/flags --config Release --target ${{ matrix.target || 'universal_agent_manager' }} --parallel 4
      - name: Check the application, runner and bundle for excluded names
        run: python3 scripts/check_build_flag_leaks.py --build-dir Builds/flags
      - name: Record unreviewed native strings for review
        if: failure()
        run: |
          cp scripts/build_flag_native_residue.json "$RUNNER_TEMP/build_flag_native_residue.json"
          python3 scripts/check_build_flag_leaks.py --build-dir Builds/flags --residue "$RUNNER_TEMP/build_flag_native_residue.json" --record-residue || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-residue-${{ strategy.job-index }}
          path: ${{ runner.temp }}/build_flag_native_residue.json
