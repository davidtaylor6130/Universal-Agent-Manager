name: Build configurator
on:
  workflow_dispatch:
  pull_request:
    paths:
      - CMakeLists.txt
      - src/common/config/build_features.h
      - src/computer_use/**
      - src/cef/**
      - src/remote/**
      - UI-V2/src/config/buildFeatures.ts
      - UI-V2/src/App.tsx
      - tools/build-configurator/**
      - .github/workflows/build-feature-matrix.yml
permissions:
  contents: read
jobs:
  configurator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build-configurator/test_configurator.py
